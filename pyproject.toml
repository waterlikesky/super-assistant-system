[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "super-assistant-system"
version = "0.2.0"
description = "个人语境 OS：只读摄入微信/钉钉/邮件/短信导出，本地脱敏存储、检索与可演进记忆"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "sqlite-utils>=3.35",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
llm = ["llm>=0.13"]
vec = ["sqlite-vec>=0.1"]
mem0 = ["mem0ai>=0.1"]
dev = ["pytest>=8"]

[project.scripts]
sas = "sas.cli:main"

[tool.setuptools.packages.find]
include = ["sas*"]

[tool.setuptools.package-data]
sas = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
