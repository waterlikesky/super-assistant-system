[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "super-assistant-system"
version = "0.2.0"
description = "个人语境 OS：只读摄入微信/钉钉/邮件/短信导出，本地脱敏存储、检索与可演进记忆"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "sqlite-utils>=3.35",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
llm = ["llm>=0.13"]
vec = ["sqlite-vec>=0.1"]
mem0 = ["mem0ai>=0.1"]
# 记忆镜像（ADR 0001）。TDAM 的官方 SDK 不在 PyPI，需从官方仓库 sdk/memory-core/python 安装
openviking = ["openviking-sdk>=0.1"]
tdam = ["httpx>=0.24"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
sas = "sas.cli:main"

[tool.setuptools.packages.find]
include = ["sas*"]

[tool.setuptools.package-data]
sas = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
